  <text x="185" y="74" fill="#A1A1AA" font-family="monospace" font-size="10">https://corporate.demo.com</text>

  <!-- Content Layout -->
  <!-- Header nav -->
  <rect x="110" y="110" width="120" height="16" rx="4" fill="#FAFAFA" opacity="0.9"/>
  <rect x="520" y="110" width="40" height="12" rx="3" fill="#A1A1AA" opacity="0.6"/>
