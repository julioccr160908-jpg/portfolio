  <rect x="110" y="200" width="280" height="22" rx="5" fill="#FAFAFA" opacity="0.7"/>
  <rect x="110" y="235" width="440" height="12" rx="3" fill="#A1A1AA" opacity="0.6"/>
  <rect x="110" y="255" width="360" height="12" rx="3" fill="#A1A1AA" opacity="0.6"/>
  
  <!-- Buttons -->
  <rect x="110" y="285" width="120" height="32" rx="8" fill="url(#glowBlue)"/>
  <rect x="245" y="285" width="120" height="32" rx="8" fill="#18181B" stroke="#27272A"/>

  <!-- Feature Cards -->
