<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCelula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081420"/>
      <stop offset="50%" stop-color="#0B1F33"/>
      <stop offset="100%" stop-color="#061019"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC928"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgCelula)"/>
  
  <!-- Subtle Solar Glow -->
  <circle cx="700" cy="100" r="260" fill="#FFC928" opacity="0.08"/>
  <circle cx="120" cy="420" r="220" fill="#35B56B" opacity="0.05"/>

  <!-- Border Card Frame -->
  <rect x="40" y="40" width="720" height="420" rx="20" fill="#0C1B2A" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Brand Emblem Polygon SVG from original site -->
  <g transform="translate(80, 80)">
    <polygon points="35,10 80,10 95,45 65,80 20,80 5,45" fill="#FFC928" opacity="0.9"/>
    <polygon points="50,15 35,50 48,50 38,75 62,38 50,38" fill="#0B1F33"/>
  </g>

  <!-- Brand Title Badge -->
  <g transform="translate(195, 95)">
    <text x="0" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1">CÉLULA</text>
    <rect x="135" y="4" width="130" height="24" rx="4" fill="#FFFFFF"/>
    <text x="145" y="20" fill="#0B1F33" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" letter-spacing="2">ENERGIA SOLAR</text>
  </g>

  <!-- Title & Real Headings -->
  <text x="80" y="205" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" letter-spacing="-0.5">Energia Solar em Jataí-GO</text>
  <text x="80" y="245" fill="#FFC928" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22">Economize até 95% na Conta de Energia</text>

  <text x="80" y="295" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Landing page de alta conversão para loja de placas solares e projetos fotovoltaicos.</text>
  <text x="80" y="320" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Soluções para residências, empresas e propriedades rurais com simulação rápida.</text>

  <!-- Categories Highlights -->
  <g transform="translate(80, 355)">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="#13273D" stroke="#1E3A5F"/>
    <text x="18" y="21" fill="#FAFAFA" font-family="monospace" font-size="11">Residencial</text>

    <rect x="130" y="0" width="115" height="32" rx="8" fill="#13273D" stroke="#1E3A5F"/>
    <text x="146" y="21" fill="#FAFAFA" font-family="monospace" font-size="11">Comercial</text>

    <rect x="255" y="0" width="90" height="32" rx="8" fill="#13273D" stroke="#1E3A5F"/>
    <text x="272" y="21" fill="#FAFAFA" font-family="monospace" font-size="11">Rural</text>
  </g>

  <!-- Production URL badge -->
  <g transform="translate(80, 415)">
    <circle cx="6" cy="6" r="4" fill="#35B56B"/>
    <text x="18" y="10" fill="#38BDF8" font-family="monospace" font-size="11">landingpage-celula.vercel.app</text>
  </g>
</svg>
