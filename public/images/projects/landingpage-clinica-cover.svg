<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClinica" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgClinica)"/>
  <circle cx="200" cy="400" r="220" fill="#0D9488" opacity="0.06"/>

  <!-- Browser Frame -->
  <rect x="70" y="50" width="660" height="400" rx="16" fill="#111114" stroke="#27272A" stroke-width="2"/>
  <path d="M 70 66 Q 70 50 86 50 L 714 50 Q 730 50 730 66 L 730 92 L 70 92 Z" fill="#18181B"/>
  <circle cx="98" cy="71" r="5" fill="#FF5F57"/>
  <circle cx="114" cy="71" r="5" fill="#FFBD2E"/>
  <circle cx="130" cy="71" r="5" fill="#28C840"/>
  <text x="156" y="75" fill="#A1A1AA" font-family="monospace" font-size="11">landingpage-clinica.vercel.app</text>

  <!-- Content -->
  <rect x="110" y="130" width="130" height="24" rx="12" fill="#132E2B" stroke="#0D9488" stroke-opacity="0.4"/>
  <text x="125" y="146" fill="#14B8A6" font-family="sans-serif" font-size="11">SAÚDE INTEGRADA</text>

  <text x="110" y="195" fill="#FAFAFA" font-family="sans-serif" font-weight="bold" font-size="28">Cuidado Médico Humanizado</text>
  <text x="110" y="230" fill="#FAFAFA" font-family="sans-serif" font-weight="bold" font-size="28">E Tecnologia Diagnóstica</text>

  <text x="110" y="270" fill="#A1A1AA" font-family="sans-serif" font-size="13">Consultas médicas presenciais e telemedicina com agendamento</text>
  <text x="110" y="290" fill="#A1A1AA" font-family="sans-serif" font-size="13">simplificado, corpo clínico de referência e suporte contínuo.</text>

  <!-- CTA Buttons -->
  <rect x="110" y="325" width="170" height="42" rx="10" fill="url(#tealGrad)"/>
  <text x="130" y="351" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">Marcar Consulta</text>

  <!-- Cards on right -->
  <rect x="470" y="130" width="220" height="85" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="490" y="160" fill="#14B8A6" font-family="sans-serif" font-weight="bold" font-size="13">Atendimento Ágil</text>
  <text x="490" y="180" fill="#A1A1AA" font-family="sans-serif" font-size="11">Sem filas, confirmação automática via SMS/WhatsApp</text>

  <rect x="470" y="230" width="220" height="85" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="490" y="260" fill="#14B8A6" font-family="sans-serif" font-weight="bold" font-size="13">Especialistas</text>
  <text x="490" y="280" fill="#A1A1AA" font-family="sans-serif" font-size="11">Equipe multidisciplinar com ampla experiência</text>

  <rect x="470" y="330" width="220" height="70" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="490" y="360" fill="#FAFAFA" font-family="sans-serif" font-weight="bold" font-size="12">Convênios & Particular</text>
  <text x="490" y="380" fill="#A1A1AA" font-family="sans-serif" font-size="11">Aceitamos os principais planos de saúde</text>
</svg>

