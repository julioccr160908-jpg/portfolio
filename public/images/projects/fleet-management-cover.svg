<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0E0E11"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#27272A" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Window Frame Mockup -->
  <rect x="80" y="60" width="640" height="380" rx="16" fill="url(#cardBg)" stroke="#27272A" stroke-width="2"/>
  
  <!-- Window Titlebar -->
  <path d="M 80 76 Q 80 60 96 60 L 704 60 Q 720 60 720 76 L 720 100 L 80 100 Z" fill="#18181B"/>
  <circle cx="110" cy="80" r="5" fill="#FF5F57"/>
  <circle cx="126" cy="80" r="5" fill="#FFBD2E"/>
  <circle cx="142" cy="80" r="5" fill="#28C840"/>
  <text x="170" y="84" fill="#A1A1AA" font-family="monospace" font-size="12">fleet-management-dashboard.system</text>

  <!-- KPI Cards -->
  <rect x="110" y="125" width="160" height="70" rx="10" fill="#111114" stroke="#27272A"/>
  <text x="125" y="148" fill="#A1A1AA" font-family="monospace" font-size="10">TOTAL FLEET</text>
  <text x="125" y="178" fill="#FAFAFA" font-family="monospace" font-size="22" font-weight="bold">47</text>

  <rect x="290" y="125" width="160" height="70" rx="10" fill="#111114" stroke="#27272A"/>
  <text x="305" y="148" fill="#A1A1AA" font-family="monospace" font-size="10">OPERATIONAL</text>
  <text x="305" y="178" fill="#34D399" font-family="monospace" font-size="22" font-weight="bold">38</text>

  <rect x="470" y="125" width="220" height="70" rx="10" fill="#111114" stroke="#27272A"/>
  <text x="485" y="148" fill="#A1A1AA" font-family="monospace" font-size="10">MAINTENANCE ALERTS</text>
  <text x="485" y="178" fill="#FBBF24" font-family="monospace" font-size="22" font-weight="bold">6 SCHEDULED</text>

  <!-- Mock Table -->
  <rect x="110" y="220" width="580" height="190" rx="10" fill="#111114" stroke="#27272A"/>
  <rect x="110" y="220" width="580" height="35" rx="10" fill="#18181B"/>
  <text x="130" y="242" fill="#A1A1AA" font-family="monospace" font-size="11">PLATE / ID</text>
  <text x="250" y="242" fill="#A1A1AA" font-family="monospace" font-size="11">MODEL</text>
  <text x="420" y="242" fill="#A1A1AA" font-family="monospace" font-size="11">DRIVER</text>
  <text x="560" y="242" fill="#A1A1AA" font-family="monospace" font-size="11">STATUS</text>

  <!-- Table Rows -->
  <text x="130" y="280" fill="#FAFAFA" font-family="monospace" font-size="12">BRA-2E19</text>
  <text x="250" y="280" fill="#FAFAFA" font-family="sans-serif" font-size="12">Volvo FH 540</text>
  <text x="420" y="280" fill="#A1A1AA" font-family="sans-serif" font-size="12">Carlos Eduardo</text>
  <rect x="560" y="267" width="60" height="18" rx="9" fill="#065F46"/>
  <text x="575" y="280" fill="#34D399" font-family="monospace" font-size="10">ACTIVE</text>

  <text x="130" y="325" fill="#FAFAFA" font-family="monospace" font-size="12">RQN-4F82</text>
  <text x="250" y="325" fill="#FAFAFA" font-family="sans-serif" font-size="12">Mercedes Sprinter</text>
  <text x="420" y="325" fill="#A1A1AA" font-family="sans-serif" font-size="12">Marcos Santos</text>
  <rect x="560" y="312" width="60" height="18" rx="9" fill="#065F46"/>
  <text x="575" y="325" fill="#34D399" font-family="monospace" font-size="10">ACTIVE</text>

  <text x="130" y="370" fill="#FAFAFA" font-family="monospace" font-size="12">GHJ-8H11</text>
  <text x="250" y="370" fill="#FAFAFA" font-family="sans-serif" font-size="12">Scania R 450</text>
  <text x="420" y="370" fill="#A1A1AA" font-family="sans-serif" font-size="12">Roberto Almeida</text>
  <rect x="560" y="357" width="60" height="18" rx="9" fill="#78350F"/>
  <text x="573" y="370" fill="#FBBF24" font-family="monospace" font-size="10">REPAIR</text>
</svg>

