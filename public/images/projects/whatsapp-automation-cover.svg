<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1618"/>
      <stop offset="100%" stop-color="#090E11"/>
    </linearGradient>
    <linearGradient id="bubbleClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005C4B"/>
      <stop offset="100%" stop-color="#004D3F"/>
    </linearGradient>
    <linearGradient id="bubbleBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202C33"/>
      <stop offset="100%" stop-color="#182229"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Subtle glow -->
  <circle cx="400" cy="250" r="280" fill="#25D366" opacity="0.06"/>

  <!-- Phone Mockup Container -->
  <rect x="220" y="40" width="360" height="420" rx="28" fill="#111B21" stroke="#27272A" stroke-width="2"/>
  
  <!-- Notch -->
  <rect x="340" y="48" width="120" height="12" rx="6" fill="#18181B"/>

  <!-- WhatsApp Header -->
  <rect x="220" y="70" width="360" height="55" fill="#1F2C34"/>
  <circle cx="255" cy="98" r="16" fill="#25D366"/>
  <text x="248" y="103" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">AI</text>
  <text x="282" y="93" fill="#FAFAFA" font-family="sans-serif" font-weight="bold" font-size="13">Enterprise Assistant</text>
  <text x="282" y="108" fill="#25D366" font-family="monospace" font-size="10">FastAPI Webhook Online</text>

  <!-- Message 1 (Customer) -->
  <rect x="330" y="150" width="225" height="55" rx="14" fill="url(#bubbleClient)"/>
  <text x="345" y="172" fill="#FFFFFF" font-family="sans-serif" font-size="11">Olá! Gostaria de consultar o</text>
  <text x="345" y="190" fill="#FFFFFF" font-family="sans-serif" font-size="11">status do pedido #8841</text>
  <text x="520" y="198" fill="#A7F3D0" font-family="monospace" font-size="9">20:20</text>

  <!-- Pipeline indicator -->
  <rect x="250" y="225" width="300" height="34" rx="8" fill="#141F25" stroke="#27272A"/>
  <text x="270" y="246" fill="#A1A1AA" font-family="monospace" font-size="10">API: 200 OK • DB Lookup 8841 • 185ms</text>

  <!-- Message 2 (Bot response) -->
  <rect x="245" y="275" width="280" height="115" rx="14" fill="url(#bubbleBot)" stroke="#25D366" stroke-opacity="0.3"/>
  <text x="260" y="298" fill="#25D366" font-family="sans-serif" font-weight="bold" font-size="11">📦 Status do Pedido #8841</text>
  <text x="260" y="320" fill="#FAFAFA" font-family="sans-serif" font-size="11">Seu pedido está com a transportadora</text>
  <text x="260" y="338" fill="#FAFAFA" font-family="sans-serif" font-size="11">Jadlog Express a caminho.</text>
  
  <rect x="260" y="348" width="250" height="26" rx="6" fill="#111B21"/>
  <text x="270" y="365" fill="#3B82F6" font-family="monospace" font-size="10">Rastreio: JD8841009BR • Chega 04/11</text>
</svg>

